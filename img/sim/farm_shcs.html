<!DOCTYPE html>
<html lang="ko" translate="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="google" content="notranslate">
<meta http-equiv="Content-Language" content="ko">
<title>SHCS-Agri 열관리 모니터</title>
<style id="font-paperlogy">/* 페이퍼로지(Paperlogy) 내장 → 오프라인에서도 동일 표시 */




</style>
<style>
:root{
  color-scheme: dark;
  --bg:#111317; --panel:#181b21; --panel2:#1e222a; --line:#2b313b; --line2:#353c48;
  --text:#e6e8ec; --muted:#8e97a6; --dim:#5d6573;
  --grid:#22d3ee; --ess:#34d399; --pv:#facc15; --load:#fb923c; --alarm:#ef4444;
  --lo:#3b5b7a; --mid:#1f7a74; --pk:#b7791f;
  --sans:"Paperlogy","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  --mono:"Paperlogy","Malgun Gothic",sans-serif;  /* 숫자도 페이퍼로지 → 폰트 규칙: 모든 산출물 Paperlogy */
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--text)}
body{font-family:var(--sans);font-size:14px;line-height:1.45;padding-inline:16px;padding-block:14px}
.wrap{max-width:1440px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
/* header */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;justify-content:space-between;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:10px 14px}
.brand{display:flex;flex-direction:column;gap:2px}
.brand h1{margin:0;font-size:17px;font-weight:700;letter-spacing:.01em;text-wrap:balance}
.brand small{color:var(--muted);font-size:12px}
.status{display:flex;gap:14px;align-items:center;flex-wrap:wrap;font-family:var(--mono);font-size:12px;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ess);display:inline-block;margin-right:6px;box-shadow:0 0 8px var(--ess)}
.dot.alarm{background:var(--alarm);box-shadow:0 0 10px var(--alarm);animation:blink .6s steps(2) infinite}
.clock{font-size:20px;color:var(--text);font-weight:600;letter-spacing:.04em}
.band-pill{padding:3px 9px;border-radius:3px;font-family:var(--sans);font-weight:600;font-size:12px;color:#fff}
/* modes */
.modes{display:flex;gap:6px;flex-wrap:wrap}
.mode{font:600 12.5px var(--sans);color:var(--muted);background:var(--panel2);border:1px solid var(--line2);border-radius:4px;padding:7px 11px;cursor:pointer;display:flex;gap:6px;align-items:center}
.mode svg{width:14px;height:14px}
.mode:hover{color:var(--text);border-color:var(--muted)}
.mode[aria-pressed="true"]{color:#0b0d10;background:var(--ess);border-color:var(--ess)}
.mode:focus-visible,.btn:focus-visible,input:focus-visible{outline:2px solid var(--grid);outline-offset:2px}
/* layout */
.main{display:grid;grid-template-columns:minmax(0,7fr) minmax(300px,3fr);gap:12px}
.main>*{min-width:0}
@media (max-width:980px){.main{grid-template-columns:minmax(0,1fr)}}
@media (max-width:600px){body{padding-inline:10px}.diagram svg,.daychart svg{min-width:560px}.phead{padding:8px 10px}}
.panel{border:1px solid var(--line);background:var(--panel);border-radius:6px}
.phead{display:flex;justify-content:space-between;align-items:center;padding:9px 14px;border-bottom:1px solid var(--line);font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;gap:10px;flex-wrap:wrap}
.phead b{color:var(--text);letter-spacing:.02em;text-transform:none;font-size:13px}
.diagram{overflow-x:auto}
.diagram svg{display:block;width:100%;min-width:640px;height:auto}
/* timeline */
.tl{padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line)}
.tl-row{display:flex;gap:10px;align-items:center}
.btn{font:600 12px var(--sans);color:var(--text);background:var(--panel2);border:1px solid var(--line2);border-radius:4px;padding:6px 10px;cursor:pointer;display:flex;gap:6px;align-items:center;white-space:nowrap}
.btn svg{width:13px;height:13px}
.bands{display:grid;grid-template-columns:repeat(24,1fr);gap:2px;height:8px}
.bands span{border-radius:1px}
input[type=range]{width:100%;accent-color:var(--grid);margin:0}
.ticks{display:flex;justify-content:space-between;font:11px var(--mono);color:var(--dim)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
/* right panel */
.side{display:flex;flex-direction:column;gap:12px}
.metrics{padding:12px 14px;display:flex;flex-direction:column;gap:14px}
.m-label{font-size:11.5px;color:var(--muted);letter-spacing:.05em;display:flex;justify-content:space-between}
.m-val{font:700 26px var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.m-val small{font-size:13px;color:var(--muted);font-weight:400;margin-left:4px}
.bar{height:8px;background:#0c0e11;border:1px solid var(--line);border-radius:2px;position:relative;overflow:hidden}
.bar > div{height:100%;transition:width .4s,background .3s}
.bar .mark{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--alarm)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.soc{display:flex;gap:12px;align-items:center}
.batt{width:62px;height:30px;border:2px solid var(--muted);border-radius:4px;position:relative;padding:2px;flex:none}
.batt:after{content:"";position:absolute;right:-6px;top:8px;width:4px;height:10px;background:var(--muted);border-radius:0 2px 2px 0}
.batt > div{height:100%;background:var(--ess);border-radius:1px;transition:width .5s}
.calc{padding:12px 14px 14px;display:flex;flex-direction:column;gap:10px}
.calc .line{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px dashed var(--line);padding-bottom:6px;gap:10px}
.calc .line span{color:var(--muted);font-size:12.5px}
.calc .line b{font:600 15px var(--mono);font-variant-numeric:tabular-nums}
.calc .total b{font-size:20px;color:var(--ess)}
.warn{font-size:12px;color:#fca5a5;background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.35);border-radius:4px;padding:6px 8px}
.note{font-size:11.5px;color:var(--dim);line-height:1.5}
.side>section.logp{flex:1 1 0;min-height:180px;display:flex;flex-direction:column}
.event{padding:10px 14px;font:12px var(--mono);color:var(--muted);display:flex;flex-direction:column;gap:3px;flex:1 1 0;min-height:0;overflow:auto}
@media (max-width:980px){.event{max-height:220px}}
.event div b{color:var(--text);font-weight:600}
/* ess rule */
.rule{padding:12px 14px 14px;display:flex;flex-direction:column;gap:9px}
.rstrip{display:grid;grid-template-columns:repeat(24,1fr);gap:2px;height:20px}
.rstrip span{border-radius:2px;position:relative}
.rstrip span.now{outline:2px solid #fff;outline-offset:1px;z-index:1}
.rticks{position:relative;height:13px;font:10.5px var(--mono);color:var(--dim);margin-top:-5px}
.rticks span{position:absolute;transform:translateX(-50%)}.rticks span:first-child{transform:none}.rticks span:last-child{transform:translateX(-100%)}
.rlist{display:flex;flex-direction:column;gap:5px}
.ritem{display:grid;grid-template-columns:10px 64px 1fr;gap:8px;align-items:center;font-size:12.5px;color:var(--muted);padding:5px 7px;border-radius:4px;border:1px solid transparent}
.ritem i{width:10px;height:10px;border-radius:2px}
.ritem b{font:600 12px var(--mono);color:var(--text)}
.ritem.on{background:var(--panel2);border-color:var(--line2);color:var(--text)}
/* day chart */
.daychart{padding:10px 14px 0;overflow-x:auto}
.daychart svg{display:block;width:100%;min-width:640px;height:auto;cursor:pointer}
.dc-leg{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);padding:6px 14px 0}
.dc-leg i{display:inline-block;width:14px;height:3px;margin-right:5px;vertical-align:3px}
.axis{fill:var(--dim);font:10.5px var(--mono)}
/* svg */
.flow{fill:none;stroke-linecap:round;stroke-dasharray:10 12;animation:dash 1.1s linear infinite}
.flow.rev{animation-direction:reverse}
.flow.off{stroke:var(--line2)!important;animation:none;stroke-dasharray:4 8}
.wire{fill:none;stroke:var(--line2);stroke-width:2}
.node{fill:var(--panel2);stroke:var(--line2);stroke-width:1.5}
.nlabel{fill:var(--text);font:600 13px var(--sans)}
.nsub{fill:var(--muted);font:11px var(--sans)}
.nval{font:700 15px var(--mono);font-variant-numeric:tabular-nums}
.alarmflash{animation:flash .7s steps(2) infinite}
@keyframes dash{to{stroke-dashoffset:-44}}
@keyframes flash{50%{stroke:var(--alarm);fill:rgba(239,68,68,.18)}}
@keyframes blink{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.flow{animation:none}.alarmflash,.dot.alarm{animation:none}}
</style>
<style>
/* 스마트팜 열관리 모니터 전용 추가 스타일 (ESS 모니터 템플릿 디자인 계승) */
:root{--nut:#34d399;--cold:#60a5fa;--hot:#ff6b6b;--heatin:#fb923c;--dc:#facc15;--vpp:#a78bfa;--ok:#34d399;--warnc:#f59e0b;--cool:#22d3ee;--heatm:#fb923c}
.left{display:flex;flex-direction:column;gap:12px;min-width:0}
.left>.panel:first-child{flex:1 1 auto;display:flex;flex-direction:column}
.left .diagram svg{min-width:720px}
.left .diagram{display:flex;flex-direction:column;justify-content:center}
.status4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;padding:12px 14px}
@media (max-width:700px){.status4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.big{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.big .m-val{font-size:30px}
.stack{display:flex;height:26px;border-radius:3px;overflow:hidden;border:1px solid var(--line)}
.stack span{display:flex;align-items:center;justify-content:center;font:600 11.5px var(--mono);color:#0b0d10;white-space:nowrap;overflow:hidden;transition:flex-grow .4s}
.skey{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--muted)}
.skey i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.vgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.vt{background:var(--panel2);border:1px solid var(--line2);border-radius:4px;padding:7px 4px;text-align:center;display:flex;flex-direction:column;gap:2px}
.vt small{font-size:11px;color:var(--muted)}
.vt b{font:700 17px var(--mono);color:var(--text)}
.vt em{font-style:normal;font:11px var(--mono);color:var(--dim)}
.sgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;padding:12px 14px}
.sgrid .vt{text-align:left;padding:6px 8px}
.sgrid .vt b{font-size:15px}
.full .daychart svg{min-width:760px}
.ritem{grid-template-columns:10px 112px 1fr}
.rticks span{white-space:nowrap}
.rstrip span{display:flex;align-items:center;justify-content:center;font:600 10.5px var(--mono);color:rgba(255,255,255,.9);overflow:hidden}
@media (max-width:600px){.rstrip span{font-size:8.5px}.sgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.modes{align-items:center}
.hbar{flex:1 1 300px;min-width:240px;margin-left:8px;display:flex;flex-direction:column;gap:4px}
.hbar .rstrip{height:22px;cursor:pointer}
.hbar .rstrip span:hover{filter:brightness(1.3)}
.hbar .hleg{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--muted)}
.hbar .hleg i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.sig{fill:none;stroke:var(--vpp);stroke-width:2;stroke-dasharray:3 6;stroke-linecap:round;animation:dash 1.4s linear infinite}
.sig.off{stroke:var(--line2);animation:none;opacity:.6}
.dose{fill:none;stroke:#7dd3a8;stroke-width:1.6;stroke-dasharray:2 5;opacity:.7}
.tag circle{fill:#0c0e11;stroke:var(--muted);stroke-width:1.3}
.tag text{fill:var(--muted);font:600 9.5px var(--mono);text-anchor:middle}
.pump circle{fill:var(--panel2);stroke:var(--line2);stroke-width:1.5}
.cmp{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--muted);border-bottom:1px dashed var(--line);padding-bottom:6px}
.cmp b{font:600 14px var(--mono);color:var(--text)}
.ifgrp{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding-left:12px;margin-left:4px;border-left:1px solid var(--line2)}
.iflab{font-size:11.5px;color:var(--muted);letter-spacing:.04em}
.mode.ifb b{font-family:var(--mono);margin-right:2px}
.mode.ifb[aria-pressed="true"]{background:var(--cool);border-color:var(--cool);color:#0b0d10}
@media (max-width:600px){.ifgrp{border-left:none;padding-left:0;margin-left:0}}
.seg .btn[aria-pressed="true"]{background:var(--cool);color:#0b0d10;border-color:var(--cool)}
.cmp b s{color:var(--dim);font-weight:400;text-decoration:none;margin-right:6px}
</style>
<style>@font-face{font-family:'Paperlogy';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-4Regular.woff2') format('woff2');font-weight:400}@font-face{font-family:'Paperlogy';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-6SemiBold.woff2') format('woff2');font-weight:600}@font-face{font-family:'Paperlogy';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-7Bold.woff2') format('woff2');font-weight:700}@font-face{font-family:'Paperlogy';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-8ExtraBold.woff2') format('woff2');font-weight:800}</style><style>body,body *{word-break:keep-all;overflow-wrap:break-word}</style></head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1 id="hTitle">스마트팜 열관리 모니터</h1>
      <small id="hSub"></small>
    </div>
    <div class="status">
      <span id="stateTxt"><span class="dot" id="stDot"></span>정상 운전</span>
      <span class="band-pill" id="bandPill">-</span>
      <span id="scnTxt">폭염일</span>
      <span style="display:flex;flex-direction:column;align-items:flex-end;line-height:1.1"><span style="font-size:10.5px;color:var(--dim)">시뮬레이션 시각</span><span class="clock" id="clock">오후 12:00</span></span>
    </div>
  </header>

  <div class="modes" role="group" aria-label="대표일" id="modes">
    <div class="hbar" aria-label="24시간 운전 상태">
      <div class="rstrip" id="hstrip"></div>
      <div class="rticks" id="hticks"></div>
      <div class="hleg" id="hleg"></div>
    </div>
  </div>

  <div class="main">
    <div class="left">
      <section class="panel" aria-label="계통 모식도">
        <div class="phead"><b id="pidTitle">양액·열관리 계통도 · 열 흐름</b><span id="pidLeg"></span></div>
        <div class="diagram" style="flex:1 1 auto">
          <svg id="pid" viewBox="0 0 900 560" role="img" aria-label="스마트팜 양액 회로와 열관리 회로 흐름">
            <defs>
              <pattern id="gridbg" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#1c2027" stroke-width="1"/></pattern>
              <pattern id="tecp" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#2a2f38"/><path d="M0 3H6" stroke="#8a94a3" stroke-width="1"/></pattern>
              <linearGradient id="gCold" x1="0" x2="1"><stop offset="0" stop-color="#1d4ed8"/><stop offset="1" stop-color="#60a5fa"/></linearGradient>
              <linearGradient id="gHot" x1="0" x2="1"><stop offset="0" stop-color="#f87171"/><stop offset="1" stop-color="#b91c1c"/></linearGradient>
            </defs>
            <rect id="dbg" x="0" y="0" width="900" height="560" fill="url(#gridbg)"/>
            <g id="dg">
              <!-- 온실 내부 영역 : 열 유입원 -->
              <rect x="16" y="16" width="306" height="518" rx="8" fill="rgba(251,146,60,.035)" stroke="var(--heatin)" stroke-width="1.2" stroke-dasharray="6 5" opacity=".75"/>
              <text x="26" y="550" class="nsub" id="zoneTxt" style="fill:var(--heatin)">온실 내부 → 공기·일사 열이 베드·배관·탱크 표면으로 유입</text>
              <!-- 배관 바탕선 -->
              <path class="wire" d="M70 167 V380"/>
              <path class="wire" data-if="base B1 B2" d="M250 470 H300 V245 H220 V167"/>
              <path class="wire vs" data-if="A" d="M250 470 H300 V315 H340 M340 245 H220 V167"/>
              <!-- 양액 흐름 -->
              <path id="fNutR" class="flow" d="M70 167 V380" stroke="var(--nut)"/>
              <path id="fNutS" class="flow" data-if="base B1 B2" d="M250 470 H300 V245 H220 V167" stroke="var(--nut)"/>
              <path id="fNutS2" class="flow vs" data-if="A" d="M250 470 H300 V315 H340 M340 245 H220 V167" stroke="var(--nut)"/>
              <path class="wire" d="M200 470 H220"/>
              <path id="fNutT" class="flow" d="M200 470 H220" stroke="var(--nut)"/>
              <!-- 열 유입 -->
              <path id="fHeatBed" class="flow" d="M330 88 H304" stroke="var(--heatin)"/>
              <path id="fHeatPipe" class="flow" d="M322 405 H307" stroke="var(--heatin)"/>
              <path id="fHeatTank" class="flow" d="M238 432 H204" stroke="var(--heatin)"/>
              <text x="208" y="424" class="nsub" id="hTank" style="fill:var(--heatin);font-size:10px">탱크</text>
              <text x="294" y="400" class="nsub" id="hPipe" style="fill:var(--heatin);font-size:10px" text-anchor="end">배관</text>
              <text x="316" y="108" class="nsub" id="hBed" style="fill:var(--heatin);font-size:9.5px" text-anchor="middle">베드</text>

              <!-- 재배 베드 -->
              <g>
                <rect class="node" id="bedBox" x="30" y="30" width="270" height="137" rx="5"/>
                <text x="46" y="54" class="nlabel">재배 베드 · 작물 / 근권</text>
                <text x="46" y="72" class="nsub" id="bedSub">-</text>
                <text x="46" y="118" class="nval" id="vRoot" fill="var(--nut)">- ℃</text>
                <text x="46" y="138" class="nsub" id="vRootSub">근권 (양액) 온도</text>
                <text x="46" y="155" class="nsub" id="vFlowTxt" style="fill:var(--dim)">양액 공급</text>
                <g id="crops"></g>
              </g>
              <!-- 온실 환경 -->
              <g>
                <rect class="node" id="envBox" x="330" y="30" width="250" height="112" rx="5"/>
                <g transform="translate(346,44)" stroke="var(--pv)" stroke-width="1.8" fill="none"><circle cx="10" cy="10" r="5"/><path d="M10 0v2M10 18v2M0 10h2M18 10h2M3 3l1.5 1.5M15.5 15.5 17 17M3 17l1.5-1.5M15.5 4.5 17 3"/></g>
                <text x="374" y="58" class="nlabel">온실 환경</text>
                <text x="346" y="90" class="nval" id="vGh" fill="var(--heatin)">- ℃</text>
                <text x="346" y="110" class="nsub" id="vEnvSub">외기 · 일사</text>
                <text x="346" y="128" class="nsub" id="vQin" style="fill:var(--heatin)">양액 열유입 -</text>
              </g>
              <!-- 양액탱크 -->
              <g>
                <rect class="node" id="tankBox" x="30" y="380" width="170" height="140" rx="5"/>
                <rect x="44" y="398" width="54" height="72" rx="6" fill="none" stroke="#7dd3a8" stroke-width="1.8"/>
                <rect id="tankLiq" x="47" y="418" width="48" height="49" rx="3" fill="var(--nut)" opacity=".55"/>
                <text x="108" y="414" class="nlabel">양액탱크</text>
                <text x="108" y="432" class="nsub" id="tankSub">- m³ · 기존</text>
                <text x="108" y="462" class="nval" id="vTank" fill="var(--nut)">- ℃</text>
                <text x="44" y="496" class="nsub" id="vEc">EC → · pH -</text>
                <text x="44" y="512" class="nsub" id="vDo" style="fill:var(--dim)">DO 포화 -</text>
              </g>
              <!-- P-1 -->

<script>
(function(){

  const CONFIG={
    variant:'shcs',
    site:{name:'스마트팜 실증 온실 (예시)', crop:'엽채류 (상추)', beds:'다단 재배 베드 3단 × 6열'},

    tec:{modules:20, qcPer:0.40, setpoint:20, zt:0.9, eta:0.70, dTj:8, hotApp:5, heatMode:true,

         ifaces:{A: {name:'A안 · 판형 열교환기', short:'A 판형', coldApp:4, note:'양액·냉각수 완전 분리(표준). 기존 공급배관에 판형 열교환기를 끼워 넣음. 전열 효율이 높아 저온수를 목표−4℃ 정도만 낮추면 됨.'},

  const apc=h=>ap(h)+':00', aps=h=>{h=((h%24)+24)%24; return h===0?'자정':h===12?'정오':ap(h)+'시';};
  const NS='http://www.w3.org/2000/svg';
  function el(tag,attrs,parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);parent&&parent.appendChild(e);return e;}
  const DOSAT=t=>14.62-0.3898*t+0.006969*t*t-0.00005897*t*t*t;   // 담수 용존산소 포화(mg/L)

  let day=C.days[0], hour=14, playing=false, jitter=0;

  function env(d,t){
    const tt=((t%24)+24)%24; let s;
    if(tt>=5&&tt<=15) s=(1-Math.cos(Math.PI*(tt-5)/10))/2; else {const dd=(tt-15+24)%24; s=(1+Math.cos(Math.PI*dd/14))/2;}
    const tout=d.tmin+(d.tmax-d.tmin)*s;
    const irr=tt>d.rise&&tt<d.set? d.irr*Math.pow(Math.sin(Math.PI*(tt-d.rise)/(d.set-d.rise)),1.3):0;
    const tgh=Math.max(d.ghMin??-99, tout+0.5+d.gh*irr/1000);
    return {tout,irr,tgh};
  }
  function copC(tcw,thw){   // 열전 냉각 COP (접합부 온도 기준 이론 최대 × 실효율)
    const Tc=tcw-T.dTj/2+273.15, Th=thw+T.dTj/2+273.15, dT=Th-Tc;
    if(dT<1) return 3; const z=Math.sqrt(1+T.zt), cm=Tc/dT*(z-Th/Tc)/(z+1);
    return Math.min(3,Math.max(0.12,T.eta*cm));
  }
  function sim(d,o,tec){ const ca=o.ca??CA();
    const Cth=(o.tank+S.loopM3)*1.163, cap=o.modules*T.qcPer, capH=cap*1.2, set=o.set, dt=0.25;
    let tb=(d.tmin+d.tmax)/2+2, ts=set, rows=[];
    for(let n=0;n<6;n++){ rows=[];
      for(let h=0;h<24;h++){
        const r={h,tout:0,irr:0,tgh:0,tb:0,ts:0,qinB:0,qAir:0,qSun:0,qin:0,qc:0,pt:0,aux:0,cop:0};
        for(let k=0;k<4;k++){
          const e=env(d,h+(k+.5)/4), sun=H.solarKw*e.irr/1000, pmp=H.pumpKw*0.5;
          const qb=H.UA*(e.tgh-tb)+sun+pmp; tb+=qb*dt/Cth;
          const qin=H.UA*(e.tgh-ts)+sun+pmp; let qc=0, pt=0, aux=0;
          if(tec){
            const need=qin+(ts-set)*Cth;
            if(need>0) qc=Math.min(cap,need);
            else if(T.heatMode){ const nh=qin+(ts-(set-1))*Cth; if(nh<0) qc=Math.max(-capH,nh); }
            if(qc>0) pt=qc/copC(set-ca, e.tout+T.hotApp);
            else if(qc<0) pt=-qc/(1+copC(e.tout-T.hotApp, set-1+ca));
            if(qc!==0) aux=T.pumpCold+T.pumpHot+T.fanKw*Math.min(1,(Math.abs(qc)+pt)/(cap*2.2));
          }
          ts+=(qin-qc)*dt/Cth;
          r.tout+=e.tout/4; r.irr+=e.irr/4; r.tgh+=e.tgh/4; r.tb+=tb/4; r.ts+=ts/4; r.qinB+=qb/4;
          r.qAir+=H.UA*(e.tgh-(tec?ts:tb))/4; r.qSun+=sun/4; r.qin+=(tec?qin:qb)/4; r.qc+=qc/4; r.pt+=pt/4; r.aux+=aux/4;
        }
        r.pe=r.pt/T.psuEff+r.aux; r.qh=r.qc>0? r.qc+r.pt:0; r.cop=r.pt>0.01? Math.abs(r.qc)/r.pt:0;

  /* ---------- 요약 계산 ---------- */
  let SUM={};
  function calc(){
    resim();
    const inR=r=>r.sol>=S.ok[0]-0.05&&r.sol<=S.ok[1]+0.05;
    const s={qc:0,qh:0,heat:0,pt:0,aux:0,pe:0,pk:0,max:0,maxB:0,inH:0,inB:0,hotB:0,doMin:99,qin:0};

  /* ---------- 그래프 ---------- */
  function drawDay(){

    const L=56,R=1136,Tp=14,B=264, TMIN=5,TMAX=45;

    const YK=v=>B-v/kMax*(B-Tp)*0.55;
    for(let v=TMIN;v<=TMAX;v+=5){el('line',{x1:L,x2:R,y1:Y(v),y2:Y(v),stroke:'#1f242c','stroke-width':1},svg); el('text',{x:L-6,y:Y(v)+3.5,'text-anchor':'end',class:'axis'},svg).textContent=v+'℃';}
    for(let k=0;k<=kMax;k+=kMax/4) el('text',{x:R+6,y:YK(k)+3.5,class:'axis',fill:'var(--dim)'},svg).textContent=f1(k)+'kW';
    el('rect',{x:L,y:Y(S.ok[1]),width:R-L,height:Y(S.ok[0])-Y(S.ok[1]),fill:'rgba(52,211,153,.08)'},svg);
    el('line',{x1:L,x2:R,y1:Y(S.hot),y2:Y(S.hot),stroke:'rgba(239,68,68,.45)','stroke-dasharray':'2 4'},svg);
    el('text',{x:L+4,y:Y(S.hot)-4,class:'axis',fill:'rgba(239,68,68,.8)'},svg).textContent='고온 경보 '+S.hot+'℃';
    for(let h=0;h<24;h++) el('rect',{x:L+h*(R-L)/24+0.5,y:B+6,width:(R-L)/24-1,height:5,fill:BAND[bandOf(D[h])][1]},svg);
    for(let h=0;h<24;h+=3) el('text',{x:X(h),y:B+26,'text-anchor':'middle',class:'axis'},svg).textContent=aps(h);
    const bw=(R-L)/24*0.34;
    D.forEach(r=>{
      if(SH){ if(Math.abs(r.qc)>0.02) el('rect',{x:X(r.h)-bw,y:YK(Math.abs(r.qc)),width:bw-1,height:B-YK(Math.abs(r.qc)),fill:r.qc>0?'var(--cold)':'var(--heatm)',opacity:.75},svg);
              if(r.pe>0.02) el('rect',{x:X(r.h)+1,y:YK(r.pe),width:bw-1,height:B-YK(r.pe),fill:'var(--dc)',opacity:.75},svg); }
      else if(r.qin>0.02) el('rect',{x:X(r.h)-bw/2,y:YK(r.qin),width:bw,height:B-YK(r.qin),fill:'rgba(251,146,60,.55)'},svg);
    });
    const line=(key,c,w,dash,arr)=>{let p=''; (arr||D).forEach((r,i)=>p+=(i?' L':'M')+X(r.h)+' '+Y(r[key])); el('path',{d:p,fill:'none',stroke:c,'stroke-width':w,'stroke-dasharray':dash||'','stroke-linejoin':'round'},svg);};
    line('tout','var(--muted)',1.3,'5 4'); line('tgh','var(--heatin)',2);
    line('tb','var(--alarm)',2.4,'',DB);
    if(SH){ line('ts','var(--cool)',2.8); el('text',{x:R-4,y:Y(opt.set)-5,'text-anchor':'end',class:'axis',fill:'var(--cool)'},svg).textContent='목표 '+f1(opt.set)+'℃'; }
    const cx=X(hour); el('rect',{x:cx-(R-L)/48,y:Tp,width:(R-L)/24,height:B-Tp,fill:'rgba(34,211,238,.08)'},svg);
    el('line',{x1:cx,x2:cx,y1:Tp,y2:B,stroke:'var(--grid)','stroke-width':1},svg);
    const r=D[hour];
    el('text',{x:Math.min(cx+8,R-420),y:Tp+12,class:'axis',fill:'var(--text)'},svg).textContent=ap(hour)+'시  외기 '+f1(r.tout)+' · 온실 '+f1(r.tgh)+' · 양액 '+f1(r.sol)+'℃'+(SH?' (기존 '+f1(DB[hour].tb)+'℃) · Qc '+f1(r.qc)+' · 전력 '+f1(r.pe)+'kW':' · 열유입 '+f1(r.qin)+'kW');
    svg.onclick=ev=>{const pt=svg.createSVGPoint();pt.x=ev.clientX;pt.y=ev.clientY;const lp=pt.matrixTransform(svg.getScreenCTM().inverse());hour=Math.max(0,Math.min(23,Math.floor((lp.x-L)/((R-L)/24))));$('hour').value=hour;render();};

    $('vQin').textContent='양액 열유입 '+f1(r.qin)+' kW';
    { const qa=Math.max(0,r.qAir), qs=r.qSun, qb=qa*0.5+qs*0.7, qp=qa*0.2+qs*0.3, qt=qa*0.3;   // 표면적·일사 노출 비율(가정)

      $('hBed').textContent=f1(qb)+'kW'; $('hPipe').textContent='배관 '+f1(qp)+' kW'; $('hTank').textContent='탱크 '+f1(qt)+' kW';
      $('zoneTxt').textContent='온실 내부 '+f1(r.tgh)+'℃ · 일사 '+f0(r.irr)+'W/m² → 베드·배관·탱크 표면으로 열 유입 (합계 '+f1(Math.max(0,r.qin))+'kW, 펌프 발열 포함)'; }
    ['fNutR','fNutS','fNutS2','fNutT'].forEach(id=>setFlow($(id),3,4,1));

    if(SH){
      $('m2L').textContent='흡열 Qc (양액 냉각)'; $('m2').innerHTML=f1(Math.abs(r.qc))+'<small>kW</small>'; $('m2').style.color=r.qc<0?'var(--heatm)':'var(--cold)';

      $('m3L').textContent='소비전력 (AC)'; $('m3').innerHTML=f1(r.pe)+'<small>kW</small>'; $('m3n').textContent='TEC '+f1(r.pt/T.psuEff)+' · 펌프·팬 '+f1(r.aux)+'kW';
      $('m4L').textContent='COP (TEC)'; $('m4').innerHTML=r.cop?f1(r.cop):'-'; $('m4n').textContent='외기 '+f1(r.tout)+'℃ 기준 · 기존 양액 '+f1(DB[hour].tb)+'℃';
      // TEC 계통

      $('radBox').style.stroke= r.qh>0.05?'var(--hot)':'';
      fanSpd= RM?0 : (Math.abs(r.qc)>0.02? 0.4+2.6*Math.min(1,(r.qh+Math.abs(r.qc))/(cap()*2.2)) : 0);

      $('bQh').textContent=heat?'외기 흡열 '+f1(Math.abs(r.qc)-r.pt)+' kW':'방열 Qh '+f1(r.qh)+' kW';

      $('cCmd').textContent=cmd; $('cSub').textContent='목표 '+f1(opt.set)+'℃ · 현재 '+f1(sol)+'℃ · 저온수 '+T.flowCold+'L/min';

        .map(([a,v,u])=>'<div class="vt"><small>'+a+'</small><b>'+v+'</b><em>'+u+'</em></div>').join('');
    } else {

      $('m3L').textContent='양액 열유입'; $('m3').innerHTML=f1(r.qin)+'<small>kW</small>'; $('m3').style.color='var(--heatin)'; $('m3n').textContent='공기 '+f1(r.qAir)+' · 일사 '+f1(r.qSun)+'kW';
      $('m4L').textContent='용존산소 포화'; $('m4').innerHTML=f1(DOSAT(sol))+'<small>mg/L</small>'; $('m4').style.color=sol>S.hot?'var(--alarm)':'var(--text)'; $('m4n').textContent='20℃ 기준 '+f1(DOSAT(20))+' mg/L';
      $('bState').textContent=BAND[b][0]; $('bState').setAttribute('fill',BAND[b][1]==='var(--mid)'?'var(--ok)':BAND[b][1]);

  }
